<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="rtAvatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FABF13" />
      <stop offset="100%" stop-color="#FFE490" />
    </linearGradient>
    <linearGradient id="rtAvatarSilhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>
    <filter id="rtAvatarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Full background in Roadtripeado Brand Yellow -->
  <rect width="240" height="240" fill="url(#rtAvatarBg)" />
  <!-- WhatsApp-style silhouette head -->
  <circle cx="120" cy="86" r="40" fill="url(#rtAvatarSilhouette)" filter="url(#rtAvatarShadow)" />
  <!-- WhatsApp-style silhouette shoulders and torso extending to bottom -->
  <path d="M36 240 C36 166 74 144 120 144 C166 144 204 166 204 240 Z" fill="url(#rtAvatarSilhouette)" filter="url(#rtAvatarShadow)" />
</svg>
